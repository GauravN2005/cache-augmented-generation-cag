<!DOCTYPE html>
<html>
<head>
    <title>CAG Model Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 40px;
        }
        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .response-box {
            margin-top: 20px;
            background: #eef;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CAG Model — Basic Demo UI</h2>

    <form method="POST">
        <label>Enter your prompt:</label><br>
        <textarea name="prompt" required></textarea><br>
        <button type="submit">Generate</button>
    </form>

    {% if response %}
    <div class="response-box">
        <h3>Response:</h3>
        {{ response }}
    </div>
    {% endif %}
</div>

</body>
</html>
